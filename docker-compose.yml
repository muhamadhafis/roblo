services:
  postgres:
    image: postgres:16-alpine
    container_name: nomnom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nomnom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nomnomsecret}
      POSTGRES_DB: ${POSTGRES_DB:-nomnom_db}
    ports:
      - "5444:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nomnom -d nomnom_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nomnom-redis
    restart: unless-stopped
    ports:
      - "6444:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
